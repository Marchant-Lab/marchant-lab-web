"Ha desarrollado marcadores genómicos en plantas, isópodos marinos y abalones para delimitar especies y medir diversidad genética. Hoy su trabajo se centra en el ADN ambiental y la ecología molecular para estudiar y conservar la biodiversidad, en la genómica de microorganismos con potencial biotecnológico y en el diagnóstico molecular de plagas y patógenos agrícolas, este último en colaboración con AGROSAVIA.": "He has developed genomic markers for plants, marine isopods and abalones to delimit species and measure genetic diversity. His current work focuses on environmental DNA and molecular ecology to study and conserve biodiversity, on the genomics of microorganisms with biotechnological potential, and on the molecular diagnosis of agricultural pests and pathogens, the latter in collaboration with AGROSAVIA."
"En la UIS ha dirigido numerosos trabajos de grado de pregrado y posgrado, desde el diagnóstico molecular de fitopatógenos hasta el estudio de comunidades de peces. Como profesor de planta, es responsable de las asignaturas Fisiología Animal, en el pregrado de Biología, y Análisis de Datos de Secuenciación Masiva en Células, Organismos y Especies, en el posgrado, y desarrolla herramientas para la enseñanza de la fisiología y la evolución.": "At UIS he has supervised many undergraduate and graduate theses, from molecular diagnosis of plant pathogens to the study of fish communities. As a tenured faculty member, he is responsible for Animal Physiology in the undergraduate Biology program and for High-Throughput Sequencing Data Analysis in Cells, Organisms and Species at the graduate level, and develops tools for teaching physiology and evolution."
