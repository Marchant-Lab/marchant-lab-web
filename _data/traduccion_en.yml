# --- Investigador
"Profesor Asociado, Escuela de Biología, Universidad Industrial de Santander": "Associate Professor, School of Biology, Universidad Industrial de Santander"
"Investigador Asociado (I) y par evaluador reconocido por Minciencias": "Associate Researcher and recognized peer reviewer, Colombian Ministry of Science (Minciencias)"
"Biólogo chileno interesado en aplicar herramientas genéticas y ecológicas a retos de conservación de la biodiversidad y agricultura sostenible. Se formó en Biología Marina en la Universidad Católica del Norte (Coquimbo, Chile) y obtuvo su doctorado en Ciencias Biológicas en Clemson University (Carolina del Sur, EE. UU.), donde estudió la biogeografía, la adaptación térmica y la distribución del percebe Pollicipes elegans.": "Chilean biologist interested in applying genetic and ecological tools to challenges in biodiversity conservation and sustainable agriculture. He trained in Marine Biology at Universidad Católica del Norte (Coquimbo, Chile) and earned his PhD in Biological Sciences at Clemson University (South Carolina, USA), where he studied the biogeography, thermal adaptation and distribution of the gooseneck barnacle Pollicipes elegans."
"Ha desarrollado marcadores genómicos en plantas, isópodos marinos y abalones para delimitar especies y medir diversidad genética. Hoy su trabajo se centra en la biotecnología agrícola, en particular en nematodos fitoparásitos de cultivos colombianos, en colaboración con AGROSAVIA.": "He has developed genomic markers for plants, marine isopods and abalones to delimit species and measure genetic diversity. His current work focuses on agricultural biotechnology, particularly plant-parasitic nematodes of Colombian crops, in collaboration with AGROSAVIA."
"En la UIS ha dirigido numerosos trabajos de grado de pregrado y posgrado, desde el diagnóstico molecular de fitopatógenos hasta el estudio de comunidades de peces, y desarrolla herramientas para la enseñanza de la evolución.": "At UIS he has supervised many undergraduate and graduate theses, from molecular diagnosis of plant pathogens to the study of fish communities, and develops tools for teaching evolution."
