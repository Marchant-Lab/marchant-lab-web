# Fuente: ORCID 0000-0002-7362-3626 y CvLAC (biografía traducida y resumida). BORRADOR: revisar.
nombre: Sergio Marchant
cargo: Profesor Asociado, Escuela de Biología, Universidad Industrial de Santander
categoria: Investigador Asociado (I) y par evaluador reconocido por Minciencias
grupo: Grupo de Investigación en Biotecnología y Gestión Ambiental (iBGA)
foto: /assets/fotos/sergio_perfil.jpg
bio:
  - Biólogo chileno interesado en aplicar herramientas genéticas y ecológicas al conocimiento y el aprovechamiento sostenible de la biodiversidad. Se formó en Biología Marina en la Universidad Católica del Norte (Coquimbo, Chile) y obtuvo su doctorado en Ciencias Biológicas en Clemson University (Carolina del Sur, EE. UU.), donde estudió la biogeografía, la adaptación térmica y la distribución del percebe Pollicipes elegans.
  - Ha desarrollado marcadores genómicos en plantas, isópodos marinos y abalones para delimitar especies y medir diversidad genética. Hoy su trabajo se centra en el ADN ambiental y la ecología molecular para estudiar y conservar la biodiversidad, en la genómica de microorganismos con potencial biotecnológico y en el diagnóstico molecular de plagas y patógenos agrícolas, este último en colaboración con AGROSAVIA.
  - En la UIS ha dirigido numerosos trabajos de grado de pregrado y posgrado, desde el diagnóstico molecular de fitopatógenos hasta el estudio de comunidades de peces. Como profesor de planta, es responsable de las asignaturas Fisiología Animal, en el pregrado de Biología, y Análisis de Datos de Secuenciación Masiva en Células, Organismos y Especies, en el posgrado, y desarrolla herramientas para la enseñanza de la fisiología y la evolución.
