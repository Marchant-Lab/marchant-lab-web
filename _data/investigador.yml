bio:
  - Biólogo chileno interesado en aplicar herramientas genéticas y ecológicas a retos de conservación de la biodiversidad y agricultura sostenible. Se formó en Biología Marina en la Universidad Católica del Norte (Coquimbo, Chile) y obtuvo su doctorado en Ciencias Biológicas en Clemson University (Carolina del Sur, EE. UU.), donde estudió la biogeografía, la adaptación térmica y la distribución del percebe Pollicipes elegans.
  - Ha desarrollado marcadores genómicos en plantas, isópodos marinos y abalones para delimitar especies y medir diversidad genética. Hoy su trabajo se centra en la biotecnología agrícola, en particular en nematodos fitoparásitos de cultivos colombianos, en colaboración con AGROSAVIA.
  - En la UIS ha dirigido numerosos trabajos de grado de pregrado y posgrado, desde el diagnóstico molecular de fitopatógenos hasta el estudio de comunidades de peces, y desarrolla herramientas para la enseñanza de la evolución.
formacion:
