# Líneas generales; los detalles (lugares, especies, cultivos) van en proyectos, publicaciones y tesis.
- nombre: ADN ambiental y monitoreo de la biodiversidad
  descripcion: Uso del ADN ambiental y la secuenciación masiva para describir y monitorear la biodiversidad de los ecosistemas.
- nombre: Ecología molecular y evolución
  descripcion: Marcadores moleculares y genómica para estudiar la diversidad genética, los límites entre especies, la filogeografía y la adaptación, y herramientas para la enseñanza de la evolución.
- nombre: Genómica de microorganismos con potencial biotecnológico
  descripcion: Genómica y transcriptómica de hongos y bacterias para entender y aprovechar su potencial biotecnológico.
- nombre: Diagnóstico molecular de plagas y patógenos agrícolas
  descripcion: Herramientas morfológicas y moleculares para identificar plagas y patógenos de cultivos y apoyar su manejo.
- nombre: Nematología molecular
  descripcion: Identificación, filogenia y diversidad genética de nematodos fitoparásitos de importancia agrícola.
