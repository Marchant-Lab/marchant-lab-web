  Fusarium incarnatum, Fusarium oxysporum, Fusarium solani, Globodera pallida, Globodera rostochiensis,
  Haliotis discus, Hemibrycon colombianus, Kocuria marina, Kronoheros umbrifer, Lippia origanoides,
  Pollicipes elegans, Psidium guajava, Rhincodon typus, Saccodon dariensis, Trichodorus obtusus,
