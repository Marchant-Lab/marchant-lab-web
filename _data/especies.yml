# Nombres científicos que se muestran en cursiva en todo el sitio (_includes/cursiva.html).
# Solo género y especie: los taxones superiores (Tylenchida, Symphyla, Peripatidae…) NO van en cursiva.
# 1) generos: cada aparición del género se pone en cursiva ("Globodera spp." → solo el género).
# 2) especies: nombre completo; amplía la cursiva al epíteto (y subespecie si está en la lista).
# 4) cf: epítetos que aparecen como "Género cf. epíteto" (el epíteto también va en cursiva).
# 3) abreviados: formas como "G. pallida", tal cual aparecen en los textos.
# Al agregar un texto con una especie nueva, agregarla aquí.
generos: [Artemia, Astaena, Astroblepus, Ceratitis, Dendrobates, Elaeis, Excirolana, Fusarium, Globodera,
